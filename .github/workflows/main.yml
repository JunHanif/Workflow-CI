name: CI retraining

on:
  push:
    branches: ["main"]
    paths:
      - "MLProject/hantavirus_dataset_preprocessing/**"
      - "MLProject/modelling.py"
  pull_request:
    branches: ["main"]
    paths:
      - "MLProject/hantavirus_dataset_preprocessing/**"
      - "MLProject/modelling.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v4
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scikit-learn mlflow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: run model retraining via MLflow Project
        run: |
          cd MLProject
          mlflow run . --entry-point main --env-manager local

      - name: Commit and Push Trained Model Artifacts
        if: github.event_name != 'pull_request'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add MLProject/mlruns/

          if git diff --staged --quiet; then
            echo "Tidak ada perubahan artefak model baru. Skip commit."
          else
            git commit -m "Automated CI: Update local mlruns model artifacts"
            git push
          fi

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and Push Docker Image via MLflow
        if: github.event_name != 'pull_request'
        run: |
          cd MLProject

          MODEL_PATH=$(find mlruns -type d -name "model" | head -n 1)
          echo "Model lokal ditemukan di jalur: $MODEL_PATH"

          mlflow models build-docker --model-uri "$MODEL_PATH" --name "${{ secrets.DOCKER_HUB_USERNAME }}/hantavirus-classifier-ci:latest"

          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/hantavirus-classifier-ci:latest
